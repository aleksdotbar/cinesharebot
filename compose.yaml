services:
  bot:
    image: ${BOT_IMAGE:?supplied by the verified release}
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 20s
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set in the panel}
      TMDB_KEY: ${TMDB_KEY:?set in the panel}
      ANALYTICS_CHAT_ID: ${ANALYTICS_CHAT_ID:?set in the panel}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in the panel}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:?set in the panel}
      PORT: "3000"
      RUST_LOG: cinesharebot=info
    tmpfs:
      - /tmp:size=16777216,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, /app, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
